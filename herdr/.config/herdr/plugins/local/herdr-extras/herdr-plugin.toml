# id "local.user": the palette labels plugin rows by the id's last segment, so
# these read "User: …", the same prefix it gives the palette's own [[command]]s.
id = "local.user"
name = "User"
version = "0.2.0"
description = "Sysmon poller, git remote refresh for the sidebar, pane split flips for the palette."
min_herdr_version = "0.8.0"
platforms = ["macos", "linux"]

[[startup]]
command = ["herdr-sysmon-ensure"]

[[startup]]
command = ["herdr-git-tokens"]

# herdr computes branch/git_status from LOCAL refs and never fetches, so
# ahead/behind counts go stale until something updates origin/*.
[[startup]]
command = ["herdr-git-fetch"]

# report-metadata is display-only and lost on restart; herdr-task keeps its
# own workspace map and re-applies it here.
[[startup]]
command = ["herdr-task", "restore"]

[[events]]
on = "workspace.created"
command = ["herdr-git-tokens"]

[[events]]
on = "workspace.created"
command = ["herdr-task", "restore"]

[[events]]
on = "pane.focused"
command = ["herdr-git-tokens"]

[[events]]
on = "workspace.created"
command = ["herdr-git-fetch"]

[[events]]
on = "worktree.created"
command = ["herdr-git-fetch"]

# herdr has swap keys but no split-orientation flip.
[[actions]]
id = "toggle-pane-orientation"
title = "Toggle pane orientation"
command = ["herdr-pane-flip"]

# Collie LAN front door (Caddy) on/off; the bridge itself stays loopback-only.
[[actions]]
id = "toggle-remote-control"
title = "Toggle Remote Control"
command = ["collie-lan", "toggle"]

# `herdr plugin pane open --plugin local.user --entrypoint <id> …` spawns the
# command straight into the pane, no shell, unlike `pane split` + `pane run`.
[[panes]]
id = "gitui"
title = "gitui"
placement = "split"
command = ["gitui"]

[[panes]]
id = "yazi"
title = "yazi"
placement = "split"
command = ["yazi"]

[[panes]]
id = "agenda"
title = "agenda"
placement = "split"
command = ["agenda"]
