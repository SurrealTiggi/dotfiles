# Yazi configuration
# See: https://yazi-rs.github.io/docs/configuration/yazi

[mgr]
# Layout - hide parent column (0), show current (5) and preview (4)
ratio = [0, 2, 6]

# Always show hidden/dot files
show_hidden = true

# Sort configuration
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true

# Line mode for file list
linemode = "size"

[preview]
# Preview configuration
tab_size = 2
max_width = 600
max_height = 900
